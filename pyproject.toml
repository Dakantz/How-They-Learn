[project]
name = "how-they-learn"
version = "0.1.0"
description = "Logic for the \"How They Learn\" project"
readme = "README.md"
authors = [{ name = "Benedikt Kantz", email = "benedikt@kantz.at" }]
requires-python = ">=3.14"

dependencies = [
    "grad-cam>=1.5.7",
    "ipywidgets>=8.1.9",
    "jupyter>=1.1.1",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "tqdm>=4.70.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
    { index = "pytorch-gpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
    { index = "pytorch-gpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
[[tool.uv.index]]
name = "pytorch-gpu"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

